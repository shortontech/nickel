[workspace]
members = [
    "crates/nickel-build-support",
    "crates/nickel-codex",
    "crates/nickel-codex-fixture",
    "crates/nickel-codex-ui",
    "crates/nickel-remote-control",
    "crates/nickel-mcp-client",
    "crates/nickel-input",
    "crates/nickel-ui",
    "crates/nickel-ui-testkit",
    "crates/nickel-ui-workbench",
    "crates/ui-declarative-macros",
    "crates/nickel",
    "crates/nickel-core",
    "crates/nickel-storage",
    "crates/nickel-logging",
    "crates/nickel-markdown",
    "crates/nickel-markdown-ui",
    "crates/nickel-file",
    "crates/nickel-gaze",
    "crates/nickel-i18n",
    "crates/nickel-i18n-lint",
    "crates/nickel-platform",
    "crates/nickel-render-assets",
    "crates/nickel-session-protocol",
    "crates/nickel-settings",
    "crates/nickel-terminal",
    "crates/nickel-terminal-ui",
]
default-members = ["crates/nickel"]
resolver = "3"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[patch.crates-io]
pipewire-native = { path = "vendor/pipewire-native" }
ui-declarative-macros = { path = "crates/ui-declarative-macros" }
winit = { path = "vendor/winit" }

[patch."https://github.com/Smithay/smithay.git"]
smithay = { path = "vendor/smithay" }

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
polling = "3.11.0"
libloading = "0.8.9"
libc = "0.2.183"
zeroize = "1.9.0"
base64 = "0.22.1"
bytemuck = { version = "1.25.0", features = ["derive"] }
bitflags = "2.11.0"
ctrlc = "3.5.2"
dirs = "5.0.1"
cosmic-text = "0.19.0"
freedesktop-desktop-entry = { version = "0.8.1", default-features = false }
freedesktop-icons = "0.4.0"
fluent-bundle = "0.16.0"
flate2 = "1.1.9"
glyphon = "0.12.0"
gilrs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
ico = "0.5.0"
jiff = "0.2.34"
nucleo-matcher = "0.3.1"
nix = { version = "0.31.3", features = ["process", "signal", "socket", "uio"] }
notify = "8.2.0"
ort = "2.0.0-rc.13"
sha2 = "0.10.9"
pollster = "0.4.0"
pulldown-cmark = "0.13.4"
raw-window-handle = "0.6.2"
resvg = "0.47.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
smithay = { git = "https://github.com/Smithay/smithay.git", rev = "e3d461a057ba244d213a8498ec372b0799cca103", default-features = false, features = ["wayland_frontend", "desktop", "xwayland"] }
thiserror = "2.0.17"
toml = "0.9.8"
tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
shlex = "1.3.0"
softbuffer = "0.4.8"
smallvec = "1.15.1"
sys-locale = "0.3.2"
syn = { version = "2.0.106", features = ["full", "visit"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
unicode-segmentation = "1.12.0"
url = "2.5.7"
ureq = "3.4.0"
unic-langid = "0.9.6"
proc-macro2 = { version = "1.0.101", features = ["span-locations"] }
proptest = "1"
qrcode = { version = "0.14.1", default-features = false }
getrandom = "0.4.3"
subtle = "2.6.1"
axum = "0.8.8"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2.2"
http = "1.5.0"
rmcp = { version = "3.2.0", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }
schemars = "1.2.1"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-util = "0.7.18"
tempfile = "3.27.0"
tar = "0.4.44"
wgpu = "30.0.0"
winit = "0.30.12"
windows = "0.62.2"
winresource = "0.1.31"
xcursor = "0.3.10"
yaml_serde = "0.10.4"
zbus = { version = "5.12.0", default-features = false, features = ["blocking-api", "async-io"] }
pipewire-native = "0.1.4"
pipewire-native-spa = "0.1.4"
