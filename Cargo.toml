[workspace]
members = [
    "crates/nickel-codex",
    "crates/nickel-codex-fixture",
    "crates/nickel-codex-ui",
    "crates/nickel-ui",
    "crates/ui-declarative-macros",
    "crates/nickel-shell",
    "crates/nickel-core",
    "crates/nickel-logging",
    "crates/nickel-file",
    "crates/nickel-gaze",
    "crates/nickel-i18n",
    "crates/nickel-i18n-lint",
    "crates/nickel-platform",
    "crates/nickel-render-assets",
    "crates/nickel-session",
    "crates/nickel-shapes-test",
    "crates/nickel-settings",
]
default-members = ["crates/nickel-shell"]
resolver = "3"

[patch.crates-io]
ui-declarative-macros = { path = "crates/ui-declarative-macros" }

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
bitflags = "2.11.0"
ctrlc = "3.5.2"
dirs = "5.0.1"
cosmic-text = "0.19.0"
freedesktop-desktop-entry = { version = "0.8.1", default-features = false }
freedesktop-icons = "0.4.0"
fluent-bundle = "0.16.0"
flate2 = "1.1.9"
glyphon = "0.12.0"
gilrs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
ico = "0.5.0"
jiff = "0.2.34"
nucleo-matcher = "0.3.1"
ort = "2.0.0-rc.13"
sha2 = "0.10.9"
pollster = "0.4.0"
redb = "4.1.0"
resvg = "0.47.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sdl3 = { version = "0.18.4", features = ["unsafe_textures", "use-pkg-config"] }
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "desktop"] }
thiserror = "2.0.17"
toml = "0.9.8"
tracing = "0.1.44"
shlex = "1.3.0"
softbuffer = "0.4.8"
sys-locale = "0.3.2"
syn = { version = "2.0.106", features = ["full", "visit"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
unicode-segmentation = "1.12.0"
ureq = "3.4.0"
unic-langid = "0.9.6"
proc-macro2 = { version = "1.0.101", features = ["span-locations"] }
proptest = "1"
tempfile = "3.27.0"
tar = "0.4.44"
wgpu = "30.0.0"
winit = "0.30.12"
windows = "0.62.2"
winresource = "0.1.31"
xcursor = "0.3.10"
yaml_serde = "0.10.4"
zbus = { version = "5.12.0", default-features = false, features = ["blocking-api", "async-io"] }
