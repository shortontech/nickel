[package]
name = "nickel-markdown-ui"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Standalone read-only Nickel Markdown viewer"

[features]
default = ["application"]
application = ["dep:nickel-core", "dep:nickel-platform", "dep:twinkle", "nickel-markdown/view"]
workbench-fixtures = ["application", "dep:twinkle-testkit"]

[[bin]]
name = "nickel-markdown-ui"
path = "src/main.rs"
required-features = ["application"]

[dependencies]
nickel-ui-host = { path = "../nickel-ui-host" }
nickel-i18n = { path = "../nickel-i18n" }
nickel-markdown = { path = "../nickel-markdown", default-features = false }
nickel-core = { path = "../nickel-core", optional = true }
nickel-platform = { path = "../nickel-platform", optional = true }
twinkle = { workspace = true, optional = true }
twinkle-testkit = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
image.workspace = true
twinkle-testkit = { workspace = true }
tempfile.workspace = true
