[package]
name = "nickel-markdown"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Safe typed Markdown documents and declarative Twinkle presentation"

[features]
default = ["view"]
view = ["dep:twinkle"]

[dependencies]
nickel-i18n = { path = "../nickel-i18n" }
twinkle = { workspace = true, optional = true }
pulldown-cmark.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
