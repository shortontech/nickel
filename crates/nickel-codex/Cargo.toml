[package]
name = "nickel-codex"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "UI-independent Codex app-server client for Nickel"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
tungstenite.workspace = true
url.workspace = true
flate2.workspace = true
tar.workspace = true
ctrlc.workspace = true
dirs.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
proptest.workspace = true

[[bin]]
name = "nickel-codex-test"
path = "src/bin/nickel-codex-test.rs"

[[bin]]
name = "nickel-codex-bundle"
path = "src/bin/nickel-codex-bundle.rs"
