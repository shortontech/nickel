[package]
name = "nickel-file"
version = "0.1.0"
edition.workspace = true
autobins = false
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nickel-file"
path = "src/bin/nickel-file.rs"

[dependencies]
image.workspace = true
nickel-ui = { path = "../nickel-ui" }
nickel-core = { path = "../nickel-core" }
nickel-input = { path = "../nickel-input", features = ["winit"] }
nickel-i18n = { path = "../nickel-i18n" }
nickel-logging = { path = "../nickel-logging" }
nickel-platform = { path = "../nickel-platform" }
nickel-ui-testkit = { path = "../nickel-ui-testkit" }
notify.workspace = true
tracing.workspace = true
sys-locale.workspace = true
winit.workspace = true
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
sha2.workspace = true
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9"

[target.'cfg(target_os = "windows")'.build-dependencies]
ico.workspace = true
image.workspace = true
winresource.workspace = true
