[package]
name = "nickel-file"
version = "0.2.0"
edition.workspace = true
autobins = false
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nickel-file"
path = "src/bin/nickel-file.rs"

[dependencies]
nickel-ui-host = { path = "../nickel-ui-host" }
image.workspace = true
twinkle = { workspace = true }
nucleo-matcher.workspace = true
nickel-core = { path = "../nickel-core" }
twinkle-input = { workspace = true, features = ["winit"] }
nickel-i18n = { path = "../nickel-i18n" }
nickel-logging = { path = "../nickel-logging" }
nickel-platform = { path = "../nickel-platform" }
nickel-session-protocol = { path = "../nickel-session-protocol" }
twinkle-testkit = { workspace = true, optional = true }
notify.workspace = true
tracing.workspace = true
sys-locale.workspace = true
icu_collator = "2.2.0"
icu_locale = "2.2.0"
winit.workspace = true
raw-window-handle.workspace = true
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
twinkle-testkit = { workspace = true }
sha2.workspace = true
softbuffer.workspace = true
tempfile = "3"

[features]
default = []
workbench-fixtures = ["dep:twinkle-testkit"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9"
url.workspace = true

[target.'cfg(target_os = "windows")'.build-dependencies]
nickel-build-support = { path = "../nickel-build-support" }
