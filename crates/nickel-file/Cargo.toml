[package]
name = "nickel-file"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
image.workspace = true
nickel-ui = { path = "../nickel-ui" }
nickel-core = { path = "../nickel-core" }
nickel-input = { path = "../nickel-input", features = ["sdl"] }
nickel-logging = { path = "../nickel-logging" }
nickel-platform = { path = "../nickel-platform" }
tracing.workspace = true
sdl3.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
ico.workspace = true
image.workspace = true
winresource.workspace = true
