[package]
name = "nickel-uwu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["diagnostics"]
diagnostics = []

[lib]
name = "nickel_uwu"

[[bin]]
name = "nickel-windows-frame-probe"
path = "src/main.rs"
required-features = ["diagnostics"]

[target.'cfg(target_os = "windows")'.dependencies]
libloading = { workspace = true }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_Storage_Packaging_Appx", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62.2"
