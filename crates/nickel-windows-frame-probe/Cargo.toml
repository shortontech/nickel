[package]
name = "nickel-windows-frame-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
libloading = { workspace = true }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62.2"
