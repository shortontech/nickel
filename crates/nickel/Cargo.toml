[package]
name = "nickel"
version = "0.1.0"
default-run = "nickel"
autobins = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Preserve the Rust library name while downstream crates migrate to the unified
# package. The product package and primary executable are both named `nickel`.
[lib]
name = "nickel_shell"

[features]
default = ["backend-udev"]
workbench-fixtures = ["dep:nickel-ui-testkit", "nickel-codex-ui/workbench-fixtures"]
backend-winit = ["smithay/backend_winit", "nickel-input/winit"]
backend-udev = [
    "smithay/backend_drm",
    "smithay/backend_egl",
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "smithay/backend_session_libseat",
    "smithay/backend_udev",
    "smithay/renderer_gl",
    "smithay/renderer_multi",
]

[dependencies]
image.workspace = true
jiff.workspace = true
sha2.workspace = true
nickel-ui = { path = "../nickel-ui" }
nickel-core = { path = "../nickel-core" }
nickel-file = { path = "../nickel-file" }
nickel-codex = { path = "../nickel-codex" }
nickel-codex-ui = { path = "../nickel-codex-ui" }
nickel-i18n = { path = "../nickel-i18n" }
nickel-input = { path = "../nickel-input", features = ["winit", "windows"] }
nickel-logging = { path = "../nickel-logging" }
nickel-session-protocol = { path = "../nickel-session-protocol" }
nucleo-matcher.workspace = true
resvg.workspace = true
raw-window-handle.workspace = true
softbuffer.workspace = true
tracing.workspace = true
winit.workspace = true
zeroize.workspace = true
nickel-ui-testkit = { path = "../nickel-ui-testkit", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
nickel-platform = { path = "../nickel-platform" }
freedesktop-desktop-entry.workspace = true
freedesktop-icons.workspace = true
shlex.workspace = true
zbus.workspace = true
libloading.workspace = true
notify.workspace = true
pipewire-native.workspace = true
pipewire-native-spa.workspace = true
serde_json.workspace = true
smithay.workspace = true
evdev = "0.13.2"
bitflags.workspace = true
nix.workspace = true
thiserror.workspace = true
xcursor.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3.6.1"

[target.'cfg(target_os = "windows")'.dependencies]
nickel-platform = { path = "../nickel-platform" }
pollster.workspace = true
windows-core = "0.62.2"
windows = { workspace = true, features = [
    "Foundation",
    "Media_Control",
    "System",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_WiFi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
nickel-ui-testkit = { path = "../nickel-ui-testkit" }
sha2.workspace = true
tempfile = "3.25.0"
toml.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
smithay-client-toolkit = "0.20.0"

[[bin]]
name = "nickel"
path = "src/bin/nickel.rs"

[[bin]]
name = "nickel-login"
path = "src/bin/nickel-login.rs"

[[bin]]
name = "nickel-screenshot"
path = "src/bin/nickel-screenshot.rs"

[[bin]]
name = "nickel-test-input"
path = "src/bin/nickel-test-input.rs"

[[bin]]
name = "nickel-nested-acceptance"
path = "src/bin/nickel-nested-acceptance.rs"
required-features = ["backend-winit"]

[[bin]]
name = "nickel-test-notification"
path = "src/bin/nickel-test-notification.rs"

[[bin]]
name = "nickel-test-tray"
path = "src/bin/nickel-test-tray.rs"

[[bin]]
name = "nickel-input-harness"
path = "src/bin/nickel-input-harness.rs"

[[bin]]
name = "nickel-launcher-verify"
path = "src/bin/nickel-launcher-verify.rs"
required-features = ["workbench-fixtures"]

[[example]]
name = "pointer_constraints"
required-features = ["backend-winit"]

[[example]]
name = "input_method_acceptance"
required-features = ["backend-winit"]

[target.'cfg(target_os = "windows")'.build-dependencies]
nickel-build-support = { path = "../nickel-build-support" }
