[package]
name = "nickel"
version = "0.2.0"
default-run = "nickel"
autobins = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["backend-udev"]
compositor = ["dep:nickel-linux-session"]
backend-udev = ["compositor", "nickel-linux-session/backend-udev"]
backend-winit = ["compositor", "nickel-linux-session/backend-winit"]
workbench-fixtures = ["nickel-shell/workbench-fixtures", "dep:twinkle-testkit"]

[dependencies]
nickel-shell = { path = "../nickel-shell" }
nickel-core = { path = "../nickel-core" }
nickel-session-protocol = { path = "../nickel-session-protocol" }
nickel-jsx-host = { path = "../nickel-jsx-host" }
image.workspace = true
ctrlc.workspace = true
serde_json.workspace = true
tempfile = "3.25.0"
twinkle-input = { workspace = true }
twinkle-presentation = { workspace = true, features = ["jsx"] }
twinkle_ui = { workspace = true }
twinkle-testkit = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nickel-linux-session = { path = "../nickel-linux-session", default-features = false, optional = true }

[dev-dependencies]
winit.workspace = true
softbuffer.workspace = true
toml.workspace = true
twinkle-testkit = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
smithay-client-toolkit = "0.20.0"

[[bin]]
name = "nickel"
path = "src/bin/nickel.rs"
required-features = ["backend-udev"]

[[bin]]
name = "nickel-nested"
path = "src/bin/nickel-nested.rs"
required-features = ["backend-winit"]

[[bin]]
name = "nickel-plugin"
path = "src/bin/nickel-plugin.rs"

[[bin]]
name = "nickel-login"
path = "src/bin/nickel-login.rs"

[[bin]]
name = "nickel-screenshot"
path = "src/bin/nickel-screenshot.rs"

[[bin]]
name = "nickel-launcher-verify"
path = "src/bin/nickel-launcher-verify.rs"
required-features = ["workbench-fixtures"]

[[example]]
name = "pointer_constraints"
required-features = ["backend-winit"]

[[example]]
name = "input_method_acceptance"
required-features = ["backend-winit"]

[target.'cfg(target_os = "windows")'.build-dependencies]
nickel-build-support = { path = "../nickel-build-support" }
