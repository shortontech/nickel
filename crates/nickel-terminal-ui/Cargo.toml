[package]
name = "nickel-terminal-ui"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobins = false

[[bin]]
name = "nickel-terminal"
path = "src/bin/nickel-terminal.rs"

[dependencies]
nickel-ui-host = { path = "../nickel-ui-host" }
nickel-i18n = { path = "../nickel-i18n" }
twinkle-input = { path = "../twinkle-input" }
nickel-core = { path = "../nickel-core" }
nickel-terminal = { path = "../nickel-terminal" }
twinkle = { path = "../twinkle" }
nickel-logging = { path = "../nickel-logging" }
twinkle-render-assets = { path = "../twinkle-render-assets" }
winit.workspace = true
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
