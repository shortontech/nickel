[package]
name = "nickel-terminal-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobins = false

[[bin]]
name = "nickel-terminal"
path = "src/bin/nickel-terminal.rs"

[dependencies]
nickel-input = { path = "../nickel-input" }
nickel-terminal = { path = "../nickel-terminal" }
nickel-ui = { path = "../nickel-ui" }
nickel-logging = { path = "../nickel-logging" }
winit.workspace = true
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
