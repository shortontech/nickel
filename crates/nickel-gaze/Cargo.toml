[package]
name = "nickel-gaze"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ctrlc.workspace = true
image.workspace = true
nickel-components = { path = "../nickel-components" }
ort.workspace = true
serde.workspace = true
serde_json.workspace = true
sdl3.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
ureq.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14.0"

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10.11", default-features = true, features = ["input-msmf"] }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", default-features = true, features = ["input-avfoundation"] }

[[bin]]
name = "nickel-gaze-probe"
path = "src/main.rs"

[[bin]]
name = "nickel-gaze-grid"
path = "src/bin/nickel-gaze-grid.rs"
