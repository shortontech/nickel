name: Tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RUSTC_WRAPPER: ""

jobs:
  windows-installer:
    name: Windows x86-64 MSI
    runs-on: windows-2025

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Validate the release tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH."
          }
          $parts = @([int]$Matches[1], [int]$Matches[2], [int]$Matches[3])
          if ($parts[0] -gt 255 -or $parts[1] -gt 255 -or $parts[2] -gt 65535) {
            throw "The tag version is outside Windows Installer version limits."
          }
          $version = $parts -join '.'
          "version=$version" >> $env:GITHUB_OUTPUT
          "NICKEL_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1

      - name: Build the Windows release binaries
        shell: pwsh
        run: |
          cargo build --locked --release -p nickel --bin nickel
          cargo build --locked --release -p nickel-terminal-ui --bin nickel-terminal
          cargo build --locked --release -p nickel-windows-shell-setup --bin nickel-shell-setup

      - name: Stage the MSI payload
        shell: pwsh
        run: |
          $payload = Join-Path $PWD 'target\package\windows'
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item target\release\nickel.exe $payload
          Copy-Item target\release\nickel-terminal.exe $payload
          Copy-Item target\release\nickel-shell-setup.exe $payload
          Copy-Item LICENSE-MIT $payload
          Copy-Item LICENSE-APACHE $payload
          Copy-Item Cargo.lock $payload
          Copy-Item packaging\NOTICE.md $payload
          Copy-Item packaging\THIRD_PARTY_LICENSES.txt $payload

      - name: Build the MSI
        shell: pwsh
        run: |
          $payload = (Resolve-Path 'target\package\windows').Path
          $output = Join-Path $PWD 'target\installer'
          New-Item -ItemType Directory -Force $output | Out-Null
          dotnet build packaging\windows\Nickel.Installer.wixproj `
            --configuration Release `
            -p:ProductVersion=$env:NICKEL_VERSION `
            -p:PayloadDir="$payload" `
            -p:OutputPath="$output\"

      - name: Verify MSI contents
        id: package
        shell: pwsh
        run: |
          $expected = "Nickel-$env:NICKEL_VERSION-x86_64.msi"
          $msi = Get-ChildItem target\installer -Filter $expected -Recurse | Select-Object -First 1
          if (-not $msi) {
            throw "WiX did not produce $expected."
          }
          $extract = Join-Path $env:RUNNER_TEMP 'nickel-msi-layout'
          $log = Join-Path $env:RUNNER_TEMP 'nickel-msi-layout.log'
          $arguments = @('/a', $msi.FullName, '/qn', "TARGETDIR=$extract", '/l*v', $log)
          $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content $log
            throw "Administrative MSI extraction failed with exit code $($process.ExitCode)."
          }
          foreach ($file in @('nickel.exe', 'nickel-terminal.exe', 'nickel-shell-setup.exe')) {
            if (-not (Get-ChildItem $extract -Filter $file -Recurse)) {
              throw "The MSI layout is missing $file."
            }
          }
          $checksum = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($msi.Name)" | Set-Content "$($msi.FullName).sha256" -Encoding ascii
          "msi=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "checksum=$($msi.FullName).sha256" >> $env:GITHUB_OUTPUT

      - name: Upload the workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nickel-${{ steps.version.outputs.version }}-windows-x86_64
          path: |
            ${{ steps.package.outputs.msi }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MSI: ${{ steps.package.outputs.msi }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          if (gh release view $env:GITHUB_REF_NAME 2>$null) {
            gh release upload $env:GITHUB_REF_NAME $env:MSI $env:CHECKSUM --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $env:MSI $env:CHECKSUM `
              --verify-tag `
              --title "Nickel $env:NICKEL_VERSION" `
              --generate-notes
          }
