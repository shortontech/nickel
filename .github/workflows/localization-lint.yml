name: Localization lint

on:
  pull_request:
  push:

env:
  RUSTC_WRAPPER: ""

jobs:
  localization-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject untranslated UI strings
        run: cargo run -p nickel-i18n-lint -- crates
