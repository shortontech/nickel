name: Localization lint

on:
  pull_request:
  push:

env:
  RUSTC_WRAPPER: ""
  # The repository defaults to mold for local Linux builds; this runner does
  # not install mold, and this small lint tool needs no custom linker.
  RUSTFLAGS: ""

jobs:
  localization-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject untranslated UI strings
        run: cargo run -p nickel-i18n-lint -- crates
