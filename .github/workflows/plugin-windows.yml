name: Windows plugin runtime

on:
  push:
    branches:
      - feature/plugins
    paths:
      - ".github/workflows/plugin-windows.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/nickel/**"
      - "crates/nickel-core/**"
      - "crates/nickel-plugin-runtime/**"
      - "crates/nickel-session-protocol/**"
      - "crates/nickel-settings/**"
      - "crates/nickel-ui/**"
      - "assets/plugins/**"
      - "assets/plugin-runtime/**"
  pull_request:
    paths:
      - ".github/workflows/plugin-windows.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/nickel/**"
      - "crates/nickel-core/**"
      - "crates/nickel-plugin-runtime/**"
      - "crates/nickel-session-protocol/**"
      - "crates/nickel-settings/**"
      - "crates/nickel-ui/**"
      - "assets/plugins/**"
      - "assets/plugin-runtime/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: ""

jobs:
  plugin-runtime:
    name: JSX host and package contracts
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1

      - name: Install the JSX compiler
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install TypeScript
        shell: pwsh
        run: |
          npm install --global typescript@5.9.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix = npm prefix --global
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $prefix "tsc.cmd") --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test the JSX host and plugin packages
        shell: pwsh
        run: |
          cargo test --locked -p nickel-plugin-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel-session-protocol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel-core dialog_owner_must_be_a_window_on_the_same_output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel-settings --bin nickel-settings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --test plugin_panel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib plugin_panel::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib settings_plugin_report::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib settings_activation_is_registered_without_an_in_process_window
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib multiple_plugin_surface_keys_can_target_the_same_output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib installed_panel_geometry_uses_its_manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib reserved_plugin_panel_uses_full_output_and_configured_edge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib windows_appbar_rect_uses_its_declared_edge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib explorer_free_panels_stack_and_reflow_after_retirement
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib installed_window_geometry_centers_on_its_output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib installed_component_window_activates_and_retires_with_its_plugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib closing_one_installed_window_preserves_its_sibling_and_memory_account
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::plugin_launcher_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib disabled_launcher_retires_surface_without_native_fallback
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib run_plugin_can_start_render_and_retire
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib volume_osd_plugin_retires_without_native_fallback
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib volume_overlay_uses_bundled_manifest_size_and_bottom_placement
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib window_preview_plugin_reports_memory_and_can_be_disabled_or_enabled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib task_switcher_cards_render_in_jsx_and_activate_through_the_host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::jsx_taskbar_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::plugin_taskbar_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib disabled_taskbar_retires_its_visible_role
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib shell_surfaces_follow_updated_display_geometry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib desktop_work_area_follows_enabled_taskbar_outputs_and_edge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::desktop_plugin_opens_only_the_current_projected_tile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::desktop_background_menu_uses_jsx_submenu_and_typed_visibility_action
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::desktop_plugin_background_action_rejects_unavailable_and_stale_commands
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib desktop_background_plugin_reports_memory_and_retires_wallpaper_when_disabled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib bundled_desktop_surface_retires_and_returns_with_its_plugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib bundled_overlay_surfaces_follow_their_plugin_lifetimes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib fixed_shell_surface_keys_follow_bundled_plugin_activation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib shared_launcher_surface_retires_only_when_launcher_and_run_are_disabled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib desktop_secondary_press_opens_overlay_without_hiding_items_on_release_or_motion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::notification_plugin_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib pending_remote_lease_becomes_persistent_shell_notification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::control_center_plugin_renders_and_dispatches_typed_desktop_action
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib control_center_plugin_can_be_disabled_and_reenabled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib display_projection_recovery_survives_control_plugin_disablement
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::disabling_plugin_retires_host_and_clears_reported_memory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::declared_dialog_starts_closed_and_dismisses_without_retiring_its_plugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::closing_dialog_owner_retires_its_dialog_but_preserves_sibling_window
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib plugin_panel::tests::overlay_example_opens_and_hides_its_declared_surface
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::declared_overlay_opens_and_hides_without_retiring_its_plugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --bin nickel-plugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate shipped extension examples
        shell: pwsh
        run: |
          foreach ($package in @("hello-panel", "taskbar", "launcher", "desktop", "notification", "run", "control-center", "window-preview", "volume-osd")) {
            cargo run --locked -p nickel --bin nickel-plugin -- validate "assets/plugins/$package"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo run --locked -p nickel --bin nickel-plugin -- validate assets/plugins/example-dialog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p nickel --bin nickel-plugin -- validate assets/plugins/example-window
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p nickel --bin nickel-plugin -- validate assets/plugins/example-two-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p nickel --bin nickel-plugin -- validate assets/plugins/example-surface-dialog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p nickel --bin nickel-plugin -- validate assets/plugins/example-overlay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p nickel --bin nickel-plugin -- validate assets/plugins/example-task-action
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p nickel --bin nickel-plugin -- validate assets/plugins/example-control-section
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p nickel --bin nickel-plugin -- validate assets/plugins/example-widget-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p nickel --bin nickel-plugin -- validate assets/plugins/example-widget-contributor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p nickel --bin nickel-plugin -- validate assets/plugins/example-action-contributor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test the live Windows shell plugins
        shell: pwsh
        run: |
          cargo build --locked -p nickel --bin nickel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked -p nickel-settings --bin nickel-settings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokeRoot = Join-Path $env:RUNNER_TEMP "nickel-plugin-smoke"
          $env:LOCALAPPDATA = Join-Path $smokeRoot "local"
          $env:APPDATA = Join-Path $smokeRoot "roaming"
          New-Item -ItemType Directory -Force -Path @($env:LOCALAPPDATA, $env:APPDATA) | Out-Null
          $stdout = Join-Path $smokeRoot "shell.stdout"
          $stderr = Join-Path $smokeRoot "shell.stderr"
          $statusFile = Join-Path $smokeRoot "plugin-status.json"
          $shell = Start-Process -FilePath "target/debug/nickel.exe" -ArgumentList "--no-desktop-windows" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $snapshot = $null
            $ready = $false
            $lastExit = $null
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              Start-Sleep -Milliseconds 500
              $shell.Refresh()
              if ($shell.HasExited) { throw "Nickel shell exited before plugin status was available (exit $($shell.ExitCode))" }
              Remove-Item $statusFile -ErrorAction SilentlyContinue
              & "target/debug/nickel-settings.exe" --plugin-status --plugin-status-file $statusFile 2>$null | Out-Null
              $lastExit = $LASTEXITCODE
              if ($lastExit -eq 0 -and (Test-Path $statusFile)) {
                $json = Get-Content $statusFile -Raw
                try { $snapshot = $json | ConvertFrom-Json } catch { $snapshot = $null }
                if ($snapshot -and $snapshot.plugins) {
                  $ready = $true
                  foreach ($id in @("org.nickel.launcher", "org.nickel.taskbar", "org.nickel.desktop")) {
                    $plugin = $snapshot.plugins | Where-Object { $_.id -eq $id } | Select-Object -First 1
                    if (-not $plugin -or $plugin.health.state -ne "running") { $ready = $false }
                  }
                  if ($ready) { break }
                }
              }
            }
            if (-not $snapshot) { throw "Nickel Settings could not query the live shell plugin status (last exit $lastExit)" }
            if (-not $ready) {
              $states = $snapshot.plugins | Where-Object { $_.id -in @("org.nickel.launcher", "org.nickel.taskbar", "org.nickel.desktop") } | ForEach-Object { "$($_.id)=$($_.health.state)" }
              throw "Windows shell plugins did not reach running: $($states -join ', ')"
            }
            $taskbar = $snapshot.plugins | Where-Object { $_.id -eq "org.nickel.taskbar" } | Select-Object -First 1
            $taskbarBytes = [long]$taskbar.memory.native_ui_bytes
            $taskbarPeak = [long]$taskbar.memory.tracked_peak_bytes
            if ($taskbarBytes -le 0 -or $taskbarPeak -lt $taskbarBytes) {
              throw "Windows taskbar plugin has no valid retained UI memory report"
            }
            Write-Host "Live Windows launcher, taskbar, and desktop plugins are running."
            Write-Host "Taskbar retained UI: $taskbarBytes bytes; peak: $taskbarPeak bytes."
          } finally {
            $shell.Refresh()
            if (-not $shell.HasExited) { Stop-Process -Id $shell.Id -Force }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 30 }
          }

      - name: Verify top panel reserves the Windows work area
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class NickelPanelProbe {
              private delegate bool EnumWindowsProc(IntPtr handle, IntPtr context);
              [StructLayout(LayoutKind.Sequential)] private struct Rect { public int Left, Top, Right, Bottom; }
              [StructLayout(LayoutKind.Sequential)] private struct MonitorInfo {
                  public int Size;
                  public Rect Monitor;
                  public Rect Work;
                  public uint Flags;
              }
              [DllImport("user32.dll")] private static extern bool EnumWindows(EnumWindowsProc callback, IntPtr context);
              [DllImport("user32.dll")] private static extern uint GetWindowThreadProcessId(IntPtr handle, out uint processId);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] private static extern int GetWindowText(IntPtr handle, StringBuilder title, int capacity);
              [DllImport("user32.dll")] private static extern bool GetWindowRect(IntPtr handle, out Rect rect);
              [DllImport("user32.dll")] private static extern IntPtr MonitorFromWindow(IntPtr handle, uint flags);
              [DllImport("user32.dll")] private static extern bool GetMonitorInfo(IntPtr monitor, ref MonitorInfo info);
              public static string Check(uint processId) {
                  IntPtr panel = IntPtr.Zero;
                  EnumWindows((handle, context) => {
                      uint owner;
                      GetWindowThreadProcessId(handle, out owner);
                      if (owner != processId) return true;
                      var title = new StringBuilder(256);
                      GetWindowText(handle, title, title.Capacity);
                      if (title.ToString() == "Nickel Taskbar") { panel = handle; return false; }
                      return true;
                  }, IntPtr.Zero);
                  if (panel == IntPtr.Zero) return "panel window not found";
                  Rect bounds;
                  if (!GetWindowRect(panel, out bounds)) return "panel bounds unavailable";
                  IntPtr monitor = MonitorFromWindow(panel, 2);
                  var info = new MonitorInfo { Size = Marshal.SizeOf<MonitorInfo>() };
                  if (monitor == IntPtr.Zero || !GetMonitorInfo(monitor, ref info)) return "monitor work area unavailable";
                  if (bounds.Top < info.Monitor.Top || bounds.Bottom > info.Monitor.Bottom ||
                      bounds.Top >= info.Monitor.Top + (info.Monitor.Bottom - info.Monitor.Top) / 2)
                      return $"panel is not on the top edge: panel={bounds.Top}..{bounds.Bottom}, monitor={info.Monitor.Top}..{info.Monitor.Bottom}";
                  if (info.Work.Top < bounds.Bottom)
                      return $"panel is not reserved: panel bottom={bounds.Bottom}, work top={info.Work.Top}";
                  return "ok";
              }
          }
          '@
          $smokeRoot = Join-Path $env:RUNNER_TEMP "nickel-top-panel-smoke"
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          $env:LOCALAPPDATA = Join-Path $smokeRoot "local"
          $env:APPDATA = Join-Path $smokeRoot "roaming"
          New-Item -ItemType Directory -Force -Path @($env:LOCALAPPDATA, $env:APPDATA) | Out-Null
          $stdout = Join-Path $smokeRoot "shell.stdout"
          $stderr = Join-Path $smokeRoot "shell.stderr"
          $shell = Start-Process -FilePath "target/debug/nickel.exe" -ArgumentList @("--no-desktop-windows", "--panel-top") -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $result = "panel window not found"
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              Start-Sleep -Milliseconds 500
              $shell.Refresh()
              if ($shell.HasExited) { throw "Nickel shell exited before panel verification (exit $($shell.ExitCode))" }
              $result = [NickelPanelProbe]::Check([uint32]$shell.Id)
              if ($result -eq "ok") { break }
            }
            if ($result -ne "ok") { throw "Windows top panel verification failed: $result" }
            Write-Host "Windows top panel geometry and monitor work area agree."
          } finally {
            $shell.Refresh()
            if (-not $shell.HasExited) { Stop-Process -Id $shell.Id -Force }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 30 }
          }

      - name: Smoke test an installed component window on Windows
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class NickelWindowProbe {
              private delegate bool EnumWindowsProc(IntPtr handle, IntPtr context);
              [DllImport("user32.dll")] private static extern bool EnumWindows(EnumWindowsProc callback, IntPtr context);
              [DllImport("user32.dll")] private static extern uint GetWindowThreadProcessId(IntPtr handle, out uint processId);
              [DllImport("user32.dll")] private static extern bool IsWindowVisible(IntPtr handle);
              [DllImport("user32.dll")] private static extern bool IsWindowEnabled(IntPtr handle);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] private static extern int GetWindowText(IntPtr handle, StringBuilder title, int capacity);
              [DllImport("user32.dll")] private static extern bool GetWindowRect(IntPtr handle, out Rect rect);
              [DllImport("user32.dll")] private static extern bool GetClientRect(IntPtr handle, out Rect rect);
              [DllImport("user32.dll")] private static extern bool ClientToScreen(IntPtr handle, ref Point point);
              [DllImport("user32.dll")] private static extern bool SetForegroundWindow(IntPtr handle);
              [DllImport("user32.dll")] private static extern IntPtr GetForegroundWindow();
              [DllImport("user32.dll")] private static extern IntPtr WindowFromPoint(Point point);
              [DllImport("user32.dll")] private static extern IntPtr GetWindow(IntPtr handle, uint command);
              [DllImport("user32.dll")] private static extern bool SetCursorPos(int x, int y);
              [DllImport("user32.dll")] private static extern void mouse_event(uint flags, uint x, uint y, uint data, UIntPtr extraInfo);
              [DllImport("user32.dll")] private static extern bool PostMessage(IntPtr handle, uint message, IntPtr wParam, IntPtr lParam);
              private struct Rect { public int Left, Top, Right, Bottom; }
              private struct Point { public int X, Y; }
              public static bool HasVisibleWindow(uint processId, string expectedTitle) {
                  bool found = false;
                  EnumWindows((handle, context) => {
                      uint owner;
                      GetWindowThreadProcessId(handle, out owner);
                      if (owner != processId || !IsWindowVisible(handle)) return true;
                      var title = new StringBuilder(256);
                      GetWindowText(handle, title, title.Capacity);
                      Rect rect;
                      if (title.ToString() == expectedTitle && GetWindowRect(handle, out rect)
                          && rect.Right > rect.Left && rect.Bottom > rect.Top) found = true;
                      return !found;
                  }, IntPtr.Zero);
                  return found;
              }
              public static bool IsVisibleWindowEnabled(uint processId, string expectedTitle) {
                  bool enabled = false;
                  EnumWindows((handle, context) => {
                      uint owner;
                      GetWindowThreadProcessId(handle, out owner);
                      if (owner != processId || !IsWindowVisible(handle)) return true;
                      var title = new StringBuilder(256);
                      GetWindowText(handle, title, title.Capacity);
                      if (title.ToString() != expectedTitle) return true;
                      enabled = IsWindowEnabled(handle);
                      return false;
                  }, IntPtr.Zero);
                  return enabled;
              }
              public static bool CloseVisibleWindow(uint processId, string expectedTitle) {
                  bool sent = false;
                  EnumWindows((handle, context) => {
                      uint owner;
                      GetWindowThreadProcessId(handle, out owner);
                      if (owner != processId || !IsWindowVisible(handle)) return true;
                      var title = new StringBuilder(256);
                      GetWindowText(handle, title, title.Capacity);
                      if (title.ToString() == expectedTitle) sent = PostMessage(handle, 0x0010, IntPtr.Zero, IntPtr.Zero);
                      return !sent;
                  }, IntPtr.Zero);
                  return sent;
              }
              public static int VisibleWindowCount(uint processId, string expectedTitle) {
                  int count = 0;
                  EnumWindows((handle, context) => {
                      uint owner;
                      GetWindowThreadProcessId(handle, out owner);
                      if (owner != processId || !IsWindowVisible(handle)) return true;
                      var title = new StringBuilder(256);
                      GetWindowText(handle, title, title.Capacity);
                      Rect rect;
                      if (title.ToString() == expectedTitle && GetWindowRect(handle, out rect)
                          && rect.Right > rect.Left && rect.Bottom > rect.Top) count++;
                      return true;
                  }, IntPtr.Zero);
                  return count;
              }
              public static bool IsOwnedByVisibleWindow(uint processId, string dialogTitle, string ownerTitle) {
                  IntPtr owner = IntPtr.Zero;
                  IntPtr dialog = IntPtr.Zero;
                  EnumWindows((handle, context) => {
                      uint process;
                      GetWindowThreadProcessId(handle, out process);
                      if (process != processId || !IsWindowVisible(handle)) return true;
                      var title = new StringBuilder(256);
                      GetWindowText(handle, title, title.Capacity);
                      if (title.ToString() == ownerTitle) owner = handle;
                      if (title.ToString() == dialogTitle) dialog = handle;
                      return true;
                  }, IntPtr.Zero);
                  return owner != IntPtr.Zero && dialog != IntPtr.Zero && GetWindow(dialog, 4) == owner;
              }
              public static bool CloseWidestVisibleWindow(uint processId, string expectedTitle) {
                  IntPtr widest = IntPtr.Zero;
                  int width = 0;
                  EnumWindows((handle, context) => {
                      uint owner;
                      GetWindowThreadProcessId(handle, out owner);
                      if (owner != processId || !IsWindowVisible(handle)) return true;
                      var title = new StringBuilder(256);
                      GetWindowText(handle, title, title.Capacity);
                      Rect rect;
                      if (title.ToString() == expectedTitle && GetWindowRect(handle, out rect)
                          && rect.Right - rect.Left > width) {
                          widest = handle;
                          width = rect.Right - rect.Left;
                      }
                      return true;
                  }, IntPtr.Zero);
                  return widest != IntPtr.Zero && PostMessage(widest, 0x0010, IntPtr.Zero, IntPtr.Zero);
              }
              public static bool ClickVisibleWindowAt(uint processId, string expectedTitle, int x, int y) {
                  bool clicked = false;
                  EnumWindows((handle, context) => {
                      uint owner;
                      GetWindowThreadProcessId(handle, out owner);
                      if (owner != processId || !IsWindowVisible(handle)) return true;
                      var title = new StringBuilder(256);
                      GetWindowText(handle, title, title.Capacity);
                      Rect rect;
                      if (title.ToString() != expectedTitle || !GetClientRect(handle, out rect)) return true;
                      if (x < rect.Left || x >= rect.Right || y < rect.Top || y >= rect.Bottom) return true;
                      var point = new Point { X = x, Y = y };
                      if (!ClientToScreen(handle, ref point)) return true;
                      bool focused = SetForegroundWindow(handle);
                      if (!SetCursorPos(point.X, point.Y)) return true;
                      System.Threading.Thread.Sleep(80);
                      var hit = WindowFromPoint(point);
                      uint hitOwner = 0;
                      if (hit != IntPtr.Zero) GetWindowThreadProcessId(hit, out hitOwner);
                      Console.WriteLine($"Plugin click target={handle}, focused={focused}, foreground={GetForegroundWindow()}, hit={hit}, hitOwner={hitOwner}, expectedOwner={processId}, point={point.X},{point.Y}, client={rect.Right}x{rect.Bottom}");
                      mouse_event(0x0002, 0, 0, 0, UIntPtr.Zero);
                      mouse_event(0x0004, 0, 0, 0, UIntPtr.Zero);
                      clicked = true;
                      return false;
                  }, IntPtr.Zero);
