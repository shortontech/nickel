            }
            if (-not $ready) { throw "Two installed plugin windows did not become visible" }
            if (-not [NickelWindowProbe]::CloseWidestVisibleWindow([uint32]$shell.ProcessId, "Nickel Plugin Window")) {
              throw "Could not close the details plugin window"
            }
            $closed = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              Start-Sleep -Milliseconds 250
              if (-not (Get-Process -Id $shell.ProcessId -ErrorAction SilentlyContinue)) { throw "Closing a sibling exited Nickel" }
              Remove-Item $statusFile -ErrorAction SilentlyContinue
              & "target/debug/nickel-settings.exe" --plugin-status --plugin-status-file $statusFile 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path $statusFile)) { continue }
              try { $snapshot = Get-Content $statusFile -Raw | ConvertFrom-Json } catch { continue }
              $plugin = $snapshot.plugins | Where-Object { $_.id -eq "org.example.two-windows" } | Select-Object -First 1
              $count = [NickelWindowProbe]::VisibleWindowCount([uint32]$shell.ProcessId, "Nickel Plugin Window")
              if ($plugin -and $plugin.desired_enabled -and $plugin.health.state -eq "running" -and $count -eq 1 -and [long]$plugin.memory.native_ui_bytes -gt 0 -and [long]$plugin.memory.native_ui_bytes -lt $beforeBytes) {
                $reducedBytes = [long]$plugin.memory.native_ui_bytes
                $closed = $true
                break
              }
            }
            if (-not $closed) { throw "Closing details did not preserve home and reduce plugin memory" }
            if (-not [NickelWindowProbe]::ClickVisibleWindowAt([uint32]$shell.ProcessId, "Nickel Plugin Window", 200, 120)) {
              throw "Could not click the home window's reopen button"
            }
            $reopened = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              Start-Sleep -Milliseconds 250
              if (-not (Get-Process -Id $shell.ProcessId -ErrorAction SilentlyContinue)) { throw "Reopening details exited Nickel" }
              Remove-Item $statusFile -ErrorAction SilentlyContinue
              & "target/debug/nickel-settings.exe" --plugin-status --plugin-status-file $statusFile 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path $statusFile)) { continue }
              try { $snapshot = Get-Content $statusFile -Raw | ConvertFrom-Json } catch { continue }
              $plugin = $snapshot.plugins | Where-Object { $_.id -eq "org.example.two-windows" } | Select-Object -First 1
              $count = [NickelWindowProbe]::VisibleWindowCount([uint32]$shell.ProcessId, "Nickel Plugin Window")
              if ($plugin -and $plugin.desired_enabled -and $plugin.health.state -eq "running" -and $count -eq 2 -and [long]$plugin.memory.native_ui_bytes -gt $reducedBytes) {
                $reopened = $true
                break
              }
            }
            if (-not $reopened) { throw "Home button did not reopen details: windows=$count, memory=$($plugin.memory.native_ui_bytes), reduced=$reducedBytes" }
            if (-not [NickelWindowProbe]::ClickWidestVisibleWindowAt([uint32]$shell.ProcessId, "Nickel Plugin Window", 225, 77)) {
              throw "Could not click the details window's typed Close button"
            }
            $hiddenByPlugin = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              Start-Sleep -Milliseconds 250
              Remove-Item $statusFile -ErrorAction SilentlyContinue
              & "target/debug/nickel-settings.exe" --plugin-status --plugin-status-file $statusFile 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path $statusFile)) { continue }
              try { $snapshot = Get-Content $statusFile -Raw | ConvertFrom-Json } catch { continue }
              $plugin = $snapshot.plugins | Where-Object { $_.id -eq "org.example.two-windows" } | Select-Object -First 1
              $count = [NickelWindowProbe]::VisibleWindowCount([uint32]$shell.ProcessId, "Nickel Plugin Window")
              if ($plugin -and $plugin.desired_enabled -and $plugin.health.state -eq "running" -and
                  $count -eq 1 -and [long]$plugin.memory.native_ui_bytes -gt 0 -and
                  [long]$plugin.memory.native_ui_bytes -lt $beforeBytes) {
                $hiddenByPlugin = $true
                break
              }
            }
            if (-not $hiddenByPlugin) { throw "Typed window hide did not preserve home and reduce plugin memory" }
            Write-Host "Two native Windows plugin windows closed, reopened, and hid through JSX independently."
          } finally {
            if ($dev) {
              Get-CimInstance Win32_Process -Filter "ParentProcessId=$($dev.Id)" | Where-Object { $_.Name -eq "nickel.exe" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
              $dev.Refresh()
              if (-not $dev.HasExited) { Stop-Process -Id $dev.Id -Force }
            }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 30 }
            if ($profileDir -and (Test-Path $profileDir)) { Remove-Item $profileDir -Recurse -Force -ErrorAction SilentlyContinue }
          }
      - name: Smoke test a plugin extending another plugin on Windows
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class NickelSlotProbe {
              private delegate bool EnumWindowsProc(IntPtr handle, IntPtr context);
              [DllImport("user32.dll")] private static extern bool EnumWindows(EnumWindowsProc callback, IntPtr context);
              [DllImport("user32.dll")] private static extern uint GetWindowThreadProcessId(IntPtr handle, out uint processId);
              [DllImport("user32.dll")] private static extern bool IsWindowVisible(IntPtr handle);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] private static extern int GetWindowText(IntPtr handle, StringBuilder title, int capacity);
              [DllImport("user32.dll")] private static extern bool GetClientRect(IntPtr handle, out Rect rect);
              [DllImport("user32.dll")] private static extern bool ClientToScreen(IntPtr handle, ref Point point);
              [DllImport("user32.dll")] private static extern bool SetForegroundWindow(IntPtr handle);
              [DllImport("user32.dll")] private static extern bool SetCursorPos(int x, int y);
              [DllImport("user32.dll")] private static extern void mouse_event(uint flags, uint x, uint y, uint data, UIntPtr extraInfo);
              private struct Rect { public int Left, Top, Right, Bottom; }
              private struct Point { public int X, Y; }
              public static bool HasVisibleWindow(uint processId, string expectedTitle) {
                  bool found = false;
                  EnumWindows((handle, context) => {
                      uint owner;
                      GetWindowThreadProcessId(handle, out owner);
                      if (owner != processId || !IsWindowVisible(handle)) return true;
                      var title = new StringBuilder(256);
                      GetWindowText(handle, title, title.Capacity);
                      if (title.ToString() == expectedTitle) found = true;
                      return !found;
                  }, IntPtr.Zero);
                  return found;
              }
              public static bool ClickVisibleWindowAt(uint processId, string expectedTitle, int x, int y) {
                  bool clicked = false;
                  EnumWindows((handle, context) => {
                      uint owner;
                      GetWindowThreadProcessId(handle, out owner);
                      if (owner != processId || !IsWindowVisible(handle)) return true;
                      var title = new StringBuilder(256);
                      GetWindowText(handle, title, title.Capacity);
                      Rect client;
                      if (title.ToString() != expectedTitle || !GetClientRect(handle, out client)
                          || x < client.Left || x >= client.Right || y < client.Top || y >= client.Bottom) return true;
                      var point = new Point { X = x, Y = y };
                      if (!ClientToScreen(handle, ref point)) return true;
                      SetForegroundWindow(handle);
                      if (!SetCursorPos(point.X, point.Y)) return true;
                      System.Threading.Thread.Sleep(80);
                      mouse_event(0x0002, 0, 0, 0, UIntPtr.Zero);
                      mouse_event(0x0004, 0, 0, 0, UIntPtr.Zero);
                      clicked = true;
                      return false;
                  }, IntPtr.Zero);
                  return clicked;
              }
          }
          '@
          $originalLocal = $env:LOCALAPPDATA
          $originalApp = $env:APPDATA
          $baseline = 0L
          foreach ($scenario in @("base", "widget", "action")) {
            $smokeRoot = Join-Path $env:RUNNER_TEMP "nickel-slot-$scenario"
            New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
            $stdout = Join-Path $smokeRoot "dev.stdout"
            $stderr = Join-Path $smokeRoot "dev.stderr"
            $statusFile = Join-Path $smokeRoot "plugin-status.json"
            $arguments = @("dev", "assets/plugins/example-widget-host")
            if ($scenario -eq "widget") { $arguments += "assets/plugins/example-widget-contributor" }
            if ($scenario -eq "action") { $arguments += "assets/plugins/example-action-contributor" }
            $dev = Start-Process -FilePath "target/debug/nickel-plugin.exe" -ArgumentList $arguments -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $profileDir = $null
            try {
              $ready = $false
              for ($attempt = 0; $attempt -lt 120; $attempt++) {
                Start-Sleep -Milliseconds 500
                $dev.Refresh()
                if ($dev.HasExited) { throw "Widget dev shell exited early (exit $($dev.ExitCode))" }
                if (-not $profileDir -and (Test-Path $stdout)) {
                  $log = Get-Content $stdout -Raw
                  if ($log -match '(?m)^Isolated plugin profile: (.+?)\r?$') {
                    $profileDir = $Matches[1].Trim()
                    $env:LOCALAPPDATA = $profileDir
                    $env:APPDATA = $profileDir
                  }
                }
                if (-not $profileDir) { continue }
                $shell = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($dev.Id)" | Where-Object { $_.Name -eq "nickel.exe" } | Select-Object -First 1
                if (-not $shell) { continue }
                Remove-Item $statusFile -ErrorAction SilentlyContinue
                & "target/debug/nickel-settings.exe" --plugin-status --plugin-status-file $statusFile 2>$null | Out-Null
                if ($LASTEXITCODE -ne 0 -or -not (Test-Path $statusFile)) { continue }
                try { $snapshot = Get-Content $statusFile -Raw | ConvertFrom-Json } catch { continue }
                $provider = $snapshot.plugins | Where-Object { $_.id -eq "org.example.widget-host" } | Select-Object -First 1
                $contributorId = if ($scenario -eq "widget") { "org.example.widget-contributor" } else { "org.example.action-contributor" }
                $contributor = $snapshot.plugins | Where-Object { $_.id -eq $contributorId } | Select-Object -First 1
                if (-not $provider -or $provider.health.state -ne "running" -or [long]$provider.memory.native_ui_bytes -le 0) { continue }
                if ($scenario -ne "base" -and (-not $contributor -or $contributor.health.state -ne "running" -or [long]$contributor.memory.native_ui_bytes -le 0 -or [long]$provider.memory.native_ui_bytes -le $baseline)) { continue }
                $ready = $true
                if ($scenario -eq "base") { $baseline = [long]$provider.memory.native_ui_bytes }
                break
              }
              if (-not $ready) { throw "Native widget provider did not render the expected composition; baseline=$baseline" }
              if ($scenario -eq "action") {
                if ([NickelSlotProbe]::HasVisibleWindow([uint32]$shell.ProcessId, "Nickel Launcher")) {
                  throw "Launcher was already visible before the contributed action"
                }
                if (-not [NickelSlotProbe]::ClickVisibleWindowAt([uint32]$shell.ProcessId, "Nickel Plugin Window", 210, 77)) {
                  throw "Could not click the contributed action in the native provider window"
                }
                $opened = $false
                for ($attempt = 0; $attempt -lt 40; $attempt++) {
                  Start-Sleep -Milliseconds 250
                  if ([NickelSlotProbe]::HasVisibleWindow([uint32]$shell.ProcessId, "Nickel Launcher")) {
                    $opened = $true
                    break
                  }
                }
                if (-not $opened) { throw "Contributed action did not open the native Windows launcher" }
              }
            } finally {
              if ($dev) {
                Get-CimInstance Win32_Process -Filter "ParentProcessId=$($dev.Id)" | Where-Object { $_.Name -eq "nickel.exe" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
                $dev.Refresh()
                if (-not $dev.HasExited) { Stop-Process -Id $dev.Id -Force }
              }
              if (Test-Path $stderr) { Get-Content $stderr -Tail 20 }
              if ($profileDir -and (Test-Path $profileDir)) { Remove-Item $profileDir -Recurse -Force -ErrorAction SilentlyContinue }
              $env:LOCALAPPDATA = $originalLocal
              $env:APPDATA = $originalApp
            }
          }
          Write-Host "Native Windows provider rendered Widget and Action contributions and dispatched the Action callback."

      - name: Smoke test the native desktop plugin window on Windows
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class NickelDesktopProbe {
              private delegate bool EnumWindowsProc(IntPtr handle, IntPtr context);
              [DllImport("user32.dll")] private static extern bool EnumWindows(EnumWindowsProc callback, IntPtr context);
              [DllImport("user32.dll")] private static extern uint GetWindowThreadProcessId(IntPtr handle, out uint processId);
              [DllImport("user32.dll")] private static extern bool IsWindowVisible(IntPtr handle);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] private static extern int GetWindowText(IntPtr handle, StringBuilder title, int capacity);
              [DllImport("user32.dll")] private static extern bool GetWindowRect(IntPtr handle, out Rect rect);
              private struct Rect { public int Left, Top, Right, Bottom; }
              public static bool HasVisibleDesktop(uint processId) {
                  bool found = false;
                  EnumWindows((handle, context) => {
                      uint owner;
                      GetWindowThreadProcessId(handle, out owner);
                      if (owner != processId || !IsWindowVisible(handle)) return true;
                      var title = new StringBuilder(256);
                      GetWindowText(handle, title, title.Capacity);
                      Rect rect;
                      if (title.ToString() == "Nickel Desktop" && GetWindowRect(handle, out rect)
                          && rect.Right > rect.Left && rect.Bottom > rect.Top) found = true;
                      return !found;
                  }, IntPtr.Zero);
                  return found;
              }
          }
          '@
          $smokeRoot = Join-Path $env:RUNNER_TEMP "nickel-desktop-smoke"
          $env:LOCALAPPDATA = Join-Path $smokeRoot "local"
          $env:APPDATA = Join-Path $smokeRoot "roaming"
          New-Item -ItemType Directory -Force -Path @($env:LOCALAPPDATA, $env:APPDATA) | Out-Null
          $stdout = Join-Path $smokeRoot "shell.stdout"
          $stderr = Join-Path $smokeRoot "shell.stderr"
          $statusFile = Join-Path $smokeRoot "plugin-status.json"
          $shell = Start-Process -FilePath "target/debug/nickel.exe" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              Start-Sleep -Milliseconds 500
              $shell.Refresh()
              if ($shell.HasExited) { throw "Nickel exited before its desktop window appeared (exit $($shell.ExitCode))" }
              if (-not [NickelDesktopProbe]::HasVisibleDesktop([uint32]$shell.Id)) { continue }
              Remove-Item $statusFile -ErrorAction SilentlyContinue
              & "target/debug/nickel-settings.exe" --plugin-status --plugin-status-file $statusFile 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path $statusFile)) { continue }
              try { $snapshot = Get-Content $statusFile -Raw | ConvertFrom-Json } catch { continue }
              $desktop = $snapshot.plugins | Where-Object { $_.id -eq "org.nickel.desktop" } | Select-Object -First 1
              if ($desktop -and $desktop.health.state -eq "running" -and [long]$desktop.memory.native_ui_bytes -gt 0) {
                $ready = $true
                break
              }
            }
            if (-not $ready) { throw "Native Windows desktop window or its retained UI memory was unavailable" }
            Write-Host "Native Windows desktop plugin window rendered with $($desktop.memory.native_ui_bytes) retained UI bytes."
          } finally {
            $shell.Refresh()
            if (-not $shell.HasExited) { Stop-Process -Id $shell.Id -Force }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 30 }
          }
