name: Windows plugin runtime

on:
  push:
    branches:
      - feature/plugins
    paths:
      - ".github/workflows/plugin-windows.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/nickel/**"
      - "crates/nickel-core/**"
      - "crates/nickel-plugin-runtime/**"
      - "crates/nickel-session-protocol/**"
      - "crates/nickel-settings/**"
      - "crates/nickel-ui/**"
      - "assets/plugins/**"
      - "assets/plugin-runtime/**"
  pull_request:
    paths:
      - ".github/workflows/plugin-windows.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/nickel/**"
      - "crates/nickel-core/**"
      - "crates/nickel-plugin-runtime/**"
      - "crates/nickel-session-protocol/**"
      - "crates/nickel-settings/**"
      - "crates/nickel-ui/**"
      - "assets/plugins/**"
      - "assets/plugin-runtime/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: ""

jobs:
  plugin-runtime:
    name: JSX host and package contracts
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1

      - name: Install the JSX compiler
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install TypeScript
        shell: pwsh
        run: |
          npm install --global typescript@5.9.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix = npm prefix --global
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $prefix "tsc.cmd") --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test the JSX host and plugin packages
        shell: pwsh
        run: |
          cargo test --locked -p nickel-plugin-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel-session-protocol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel-settings --bin nickel-settings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --test plugin_panel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib plugin_panel::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib settings_plugin_report::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib settings_activation_is_registered_without_an_in_process_window
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib multiple_plugin_surface_keys_can_target_the_same_output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib installed_panel_geometry_uses_its_manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::plugin_launcher_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::jsx_taskbar_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::plugin_taskbar_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::desktop_plugin_opens_only_the_current_projected_tile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::desktop_background_menu_uses_jsx_submenu_and_typed_visibility_action
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::desktop_plugin_background_action_rejects_unavailable_and_stale_commands
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::notification_plugin_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::control_center_plugin_renders_and_dispatches_typed_desktop_action
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --lib live_shell::tests::disabling_plugin_retires_host_and_clears_reported_memory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nickel --bin nickel-plugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate shipped extension examples
        shell: pwsh
        run: |
          foreach ($package in @("hello-panel", "taskbar", "launcher", "desktop", "notification", "run", "control-center", "window-preview", "volume-osd")) {
            cargo run --locked -p nickel --bin nickel-plugin -- validate "assets/plugins/$package"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo run --locked -p nickel --bin nickel-plugin -- validate assets/plugins/example-dialog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p nickel --bin nickel-plugin -- validate assets/plugins/example-task-action
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p nickel --bin nickel-plugin -- validate assets/plugins/example-control-section
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test the live Windows shell plugins
        shell: pwsh
        run: |
          cargo build --locked -p nickel --bin nickel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked -p nickel-settings --bin nickel-settings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokeRoot = Join-Path $env:RUNNER_TEMP "nickel-plugin-smoke"
          $env:LOCALAPPDATA = Join-Path $smokeRoot "local"
          $env:APPDATA = Join-Path $smokeRoot "roaming"
          New-Item -ItemType Directory -Force -Path @($env:LOCALAPPDATA, $env:APPDATA) | Out-Null
          $stdout = Join-Path $smokeRoot "shell.stdout"
          $stderr = Join-Path $smokeRoot "shell.stderr"
          $statusFile = Join-Path $smokeRoot "plugin-status.json"
          $shell = Start-Process -FilePath "target/debug/nickel.exe" -ArgumentList "--no-desktop-windows" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $snapshot = $null
            $ready = $false
            $lastExit = $null
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              Start-Sleep -Milliseconds 500
              $shell.Refresh()
              if ($shell.HasExited) { throw "Nickel shell exited before plugin status was available (exit $($shell.ExitCode))" }
              Remove-Item $statusFile -ErrorAction SilentlyContinue
              & "target/debug/nickel-settings.exe" --plugin-status --plugin-status-file $statusFile 2>$null | Out-Null
              $lastExit = $LASTEXITCODE
              if ($lastExit -eq 0 -and (Test-Path $statusFile)) {
                $json = Get-Content $statusFile -Raw
                try { $snapshot = $json | ConvertFrom-Json } catch { $snapshot = $null }
                if ($snapshot -and $snapshot.plugins) {
                  $ready = $true
                  foreach ($id in @("org.nickel.launcher", "org.nickel.taskbar", "org.nickel.desktop")) {
                    $plugin = $snapshot.plugins | Where-Object { $_.id -eq $id } | Select-Object -First 1
                    if (-not $plugin -or $plugin.health.state -ne "running") { $ready = $false }
                  }
                  if ($ready) { break }
                }
              }
            }
            if (-not $snapshot) { throw "Nickel Settings could not query the live shell plugin status (last exit $lastExit)" }
            if (-not $ready) {
              $states = $snapshot.plugins | Where-Object { $_.id -in @("org.nickel.launcher", "org.nickel.taskbar", "org.nickel.desktop") } | ForEach-Object { "$($_.id)=$($_.health.state)" }
              throw "Windows shell plugins did not reach running: $($states -join ', ')"
            }
            $taskbar = $snapshot.plugins | Where-Object { $_.id -eq "org.nickel.taskbar" } | Select-Object -First 1
            $taskbarBytes = [long]$taskbar.memory.native_ui_bytes
            $taskbarPeak = [long]$taskbar.memory.tracked_peak_bytes
            if ($taskbarBytes -le 0 -or $taskbarPeak -lt $taskbarBytes) {
              throw "Windows taskbar plugin has no valid retained UI memory report"
            }
            Write-Host "Live Windows launcher, taskbar, and desktop plugins are running."
            Write-Host "Taskbar retained UI: $taskbarBytes bytes; peak: $taskbarPeak bytes."
          } finally {
            $shell.Refresh()
            if (-not $shell.HasExited) { Stop-Process -Id $shell.Id -Force }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 30 }
          }
